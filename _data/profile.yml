short_bio: >-
  <p>
  I am currently a <b>Computer Engineering (Computer Systems) Ph.D. candidate at Arizona State University</b>,
  advised by <a href="https://search.asu.edu/profile/3022467">Giulia Pedrielli</a>. I also received my
  Bachelor's in Computer Systems Engineering from ASU in 2014.
  </p>
  My research broadly revolves around robotics and cyber-physical systems, with a particular focus on system verification.
  I aim to engineer and verify these systems to ensure they exhibit no unwanted behavior, especially in safety-critical environments.
  Of particular interest to me are extreme-environment applications, such as aerospace and underwater robotics, and autonomous systems like
  robo-taxis and domestic assistance robotics.

